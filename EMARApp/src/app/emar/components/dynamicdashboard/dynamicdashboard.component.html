<div class="content-wrapper" style="margin-left: 0px !important;">

  <section class="content">
    <div class="container-fluid">
        
      <div class="card card-primary">
        <div class="card-header">
            
          <h3 class="card-title"> DashBoard</h3>
        </div>
        <div class="card-body">
          <div class="row form-group">
            <div class="col-sm-1"></div>
            <div class="col-sm-3">
          <select id="ddlChartXAxix" style="width:50%"  class="form-control" (change)="loadXAxis($event.target.value)">
            <option value="0">Select</option>
            <option value="1">Date</option>
            </select>
          </div>
          <div class="col-sm-3">
              <select id="ddlChartYAxix"   style="width:50%" class="form-control" (change)="loadYAxis($event.target.value)">
                <option value="0">Select</option>
                <option value="1">Count</option>
                </select>
              </div>
            <div style="text-align: right">
                <input type="button" id="btnday" value="Day"  (click)="day()"
                  class="btn btn-info" formControlName="Day" />
                <input type="button" id="btnmonth" value="Month" (click)="month()" class="btn btn-info" formControlName="Month" />
                <input type="button" id="btnquarter" value="Quarter"  (click)="quarter()"
                  class="btn btn-info" formControlName="Quarter" />
                <input type="button" id="btnyear" value="Year" (click)="year()" class="btn btn-info"  formControlName="Year"/>
              </div>
            </div>
          <div #chartTarget>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade  modalstyle" ngDraggable [handle]="DemoHandle1" id="myModal" role="dialog" [ngStyle]="{'display': modalPopupChart ? 'block' : 'none', 'opacity': 1}">
      <div class="modal-dialog" style="max-width: 50%; top:20%">
        <div class="modal-content">
          <div #DemoHandle1 class="modal-header " style="height: 20px ">
            <!-- <h5 style="color: white;">User History Details</h5> -->
            <button type="button" class="close" (click)="closeModel()">&times;</button>

          </div>
          <div class="modal-body bodystyle">
            <div class="table-responsive">

              <div #popUpChartTarget>

              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger" (click)="closeModel()">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
