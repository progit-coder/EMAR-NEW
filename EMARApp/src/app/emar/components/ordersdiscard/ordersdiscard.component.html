<app-commonmodal title="Order Details">
  <div class="modal-body bodystyle">
    <b>There are unsaved changes. Want to discard the changes?</b>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-success" style="border-radius: 10px;" (click)="saveChanges()">Yes</button>
    <button type="button" class="btn btn-danger" style="border-radius: 10px;" (click)="closeModel()" >No</button>
  </div>
</app-commonmodal>
