<app-commonmodal title="Resident History Details" style="width: 600px;">
  <div class="modal-body bodystyle">
      <div class="row form-group" *ngIf="demographicInfoData">
          <div class="col-sm-6 col-6 iconColor" > <strong>{{demographicInfoData.PatientLastName+", "+demographicInfoData.PatientFirstName+" "+(demographicInfoData.PatientMiddleInitial==null?'':demographicInfoData.PatientMiddleInitial)}}  ({{demographicInfoData.DOB |  date: 'MM/dd/yyyy '}})</strong></div>
      </div><br/><br/>
      <!-- <div class=" table table-responsive" style="overflow-x:hidden"> -->
          <app-table *ngIf="auditTable" [AuditTable]="auditTable"></app-table>
        <!-- </div> -->
  </div>
  <div class="modal-footer">
      <button type="button"class="btn btn-danger"  (click)="activeDefaultModal.close('Close click')">Close</button>
  </div>
</app-commonmodal>
