<app-commonmodal title="Allergy Details">
  <div class="modal-body bodystyle">
    <form [formGroup]="myform" name="allergymodal" autocomplete="off">
      <div class="row form-group">
        <!-- <div class="col-sm-2 col-md-2 col-lg-2">
          <label>Allergy
            <span class="c1">*</span></label>
        </div> -->
        <div class="col-sm-4 col-md-6 col-lg-4">
          <label>Allergy
            <span class="c1">*</span></label>
          <input formControlName="ddlallergy" class="form-control" type="text" [(ngModel)]="AllergyName"
            (keyup)="searchAllergy(AllergyName)" />
          <div *ngIf="errormessage1 != ''" style="color:red">
            <div class="right">
              <label>{{errormessage1}}</label>
            </div>
          </div>
          <div *ngIf="myform.controls.ddlallergy.errors && (myform.controls.ddlallergy.touched)" class="errorMessage">
            <div *ngIf="myform.controls.ddlallergy.errors.required">
              Allergy is required.
            </div>
          </div>
                <div class="search-result" *ngIf="flag">
            <ul *ngIf="(allergy | async) as allergyList">

              <!-- Show OTHER only when list has items -->
              <li *ngIf="allergyList.length > 0" (click)="openOtherAllergyModal()">
                OTHER ALLERGY
              </li>

              <!-- Allergy items -->
              <li *ngFor="let item of allergyList" (click)="onselectAllergy(item)">
                {{ item.AllergyDesc }}
              </li>

            </ul>
          </div>
        </div>
          <!-- OTHER Allergy Input -->
        <div class="col-sm-4 col-md-6 col-lg-4" *ngIf="showOtherAllergyInput">
          <label>Other Allergy
            <span class="c1">*</span></label>
          <input type="text" class="form-control" formControlName="otherAllergyName" [(ngModel)]="otherAllergyitem" [ngClass]="{
      'is-invalid': myform.controls.otherAllergyName.invalid }">
          <div class="errorMessage" *ngIf="myform.controls.otherAllergyName.errors">
            <div *ngIf="myform.controls.otherAllergyName.errors.required">
              Other allergy is required.
            </div>
          </div>
        </div>
        <!-- <div class="col-sm-2 col-md-2 col-lg-2">
          <label>Allergy Identification Date</label>
        </div> -->
        <div class="col-sm-4 col-md-6 col-lg-4">
          <label>Allergy Identification Date</label>
          <input type="date" id="dtallergy" [max]="maxStartDate" class="form-control" formControlName="reactiondate"
            [ngClass]="{
                  'is-valid':myform.controls.reactiondate.valid,
                  'is-invalid':myform.controls.reactiondate.invalid && myform.controls.reactiondate.touched
                }">
          <div *ngIf="errormessage3 != ''" style="color:red">
            <div class="right">
              <label>{{errormessage3}}</label>
            </div>
          </div>
          <div *ngIf="myform.controls.reactiondate.errors && (myform.controls.reactiondate.touched)"
            class="errorMessage">
            <div *ngIf="myform.controls.reactiondate.errors.required">
              Allergy Identification Date is required.
            </div>
          </div>
        </div>
        <!-- <div class="col-sm-2 col-md-2 col-lg-2">
          <label>Reaction
            <span class="c1">*</span></label>
        </div> -->
        <div class="col-sm-4 col-md-6 col-lg-4">
          <label>Reaction
            <span class="c1">*</span></label>
          <!-- <input type="text" id="txtreaction" class="form-control" formControlName="txtreaction" > -->
          <ng-multiselect-dropdown  formControlName="txtreaction" class="form-control" [(ngModel)]="selectednItemsNew" [data]="reactiondropdownList"
            [settings]="reaction_dropdownSettings" (onSelect)="onReactionSelect($event)"
            (onDeSelect)="onReactionDeSelect($event)" (onSelectAll)="onReactionSelectAll($event)"
            (onDeSelectAll)="onReactionDeSelectAll($event)" [ngClass]="{
    'is-valid':myform.controls.txtreaction.valid,
    'is-invalid':myform.controls.txtreaction.invalid && myform.controls.txtreaction.touched
  }">
          </ng-multiselect-dropdown>
          <div *ngIf="myform.controls.txtreaction.errors && (myform.controls.txtreaction.touched)" class="errorMessage">
            <div *ngIf="myform.controls.txtreaction.errors.required">
              Reaction is required.
            </div>
            <div *ngIf="myform.controls.txtreaction.errors.maxlength">
              Reaction must be 15 characters long.
            </div>
          </div>
        </div>
        <!-- <div class="col-sm-2 col-md-2 col-lg-2" *ngIf="aFlag && reactionOther">
          <label>Describe</label>
        </div> -->
        <div class="col-sm-4 col-md-6 col-lg-4" *ngIf="aFlag && reactionOther">
          <label>Describe</label>
          <input type="text" maxlength="20" class="form-control" formControlName="reactionothers" />
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <div class="col-sm-10 col-md-10 col-lg-10" *ngIf="approval==0 && pAllergyId!=0" style="color:red">
      <div style="text-align:center">
        <label>{{errormessage2}}</label>
      </div>
    </div>
    <div class="col-sm-10 col-md-10 col-lg-10" style="color:red">
      <div style="text-align:center">
        <label>{{requiredErrorMessage}}</label>
      </div>
    </div>
    <!-- *ngIf=" (pageConfig['AccessWrite'] && approval!=0) || (pAllergyId==0 -->

    <button type="button" id="btnsave"  (click)="saveAllergyInfo()" class="btn btn-success">Save</button> &nbsp;
    <button type="button" class="btn btn-danger" (click)="activeDefaultModal.close('Close click')">Close</button>
  </div>
</app-commonmodal>
