    <section class="content">
        <div class="container-fluid">
            <div class="card card-primary">
                <div class="card-header">
                    <div class="row clearfix">
                        <div class="col-sm-6">
                            <h3 class="card-title">PRN Details</h3>
                        </div>
                        <div class="col-sm-3 col-md-2 col-lg-3"></div>
                        <div class="col-sm-3 col-md-4 col-lg-3">
                            <input style="padding:inherit" type="search" class="form-control input-sm" [(ngModel)]="searchText" placeholder="Search">
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <form [formGroup]="myform" name="prnForm" autocomplete="off">
                        <div class="row form-group clearfix">
                            <div class="col-sm-6 col-md-6 col-lg-6">
                                <label>Facility</label>
                                <ng-multiselect-dropdown class="form-control" formControlName="ddlfacilities" [data]="facilities" [(ngModel)]="selectedfaItems" [settings]="dropdownSettings_Facilities" [placeholder]="'Facilities'" (onSelect)="onFacilitySelect($event)" (onDeSelect)="onFacilityDeSelect($event)">
                                </ng-multiselect-dropdown>
                            </div>
                            <div class="col-sm-6 col-md-6 col-lg-6">
                                <label>Nursing Station</label>
                                <ng-multiselect-dropdown class="form-control" formControlName="ddlnursestations" [data]="nurseStations" [settings]="dropdownSettings_NurseStations" [placeholder]="'Nursing Stations'" (onSelect)="onNurseStationSelect($event)" (onSelectAll)="onNurseStationSelectAll($event)"
                                    (onDeSelect)="onNurseStationDeSelect($event)" (onDeSelectAll)="onNurseStationDeSelectAll($event)">
                                </ng-multiselect-dropdown>
                            </div>
                            <div class=" col-sm-6 col-md-3 col-lg-3 form-group" [formGroup]="form" *ngFor="let field of fields">
                                <label>{{field.label}}</label>
                                <ng-multiselect-dropdown class="form-control" [formControlName]="field.name" [data]="field.data" [settings]="field.settings" [(ngModel)]="field.ngModel" [placeholder]="field.placeholder" (onSelect)="onCommonSelectItems($event)" (onSelectAll)="onCommonSelectAllItems($event)"
                                    (onDeSelect)="onCommonDeSelectItems($event)" (onDeSelectAll)="onCommonDeSelectAllItems(field.name)">
                                </ng-multiselect-dropdown>
                            </div>
                            <!-- <div class="col-sm-6 col-lg-2" *ngIf="companyToBed===1">
                    <label>Floor</label>
                    <ng-multiselect-dropdown class="form-control" formControlName="ddlfloors" [data]="floors" [settings]="dropdownSettings_Floors"
                      [placeholder]="'Floors'" (onSelect)="onFloorSelect($event)" (onSelectAll)="onFloorSelectAll($event)"
                      (onDeSelect)="onFloorDeSelect($event)" (onDeSelectAll)="onFloorDeSelectAll($event)">
                    </ng-multiselect-dropdown>
                  </div> -->
                            <!-- <div class="col-sm-6 col-lg-2" *ngIf="companyToBed===1">
                    <label>Wing</label>
                    <ng-multiselect-dropdown class="form-control" formControlName="ddlwings" [data]="wings" [settings]="dropdownSettings_Wings"
                      [placeholder]="'Wings'" (onSelect)="onWingSelect($event)" (onSelectAll)="onWingSelectAll($event)"
                      (onDeSelect)="onWingDeSelect($event)" (onDeSelectAll)="onWingDeSelectAll($event)">
                    </ng-multiselect-dropdown>
                  </div> -->
                            <!-- <div class="col-sm-6 col-lg-2" *ngIf="companyToBed===1">
                    <label>Room</label>
                    <ng-multiselect-dropdown class="form-control" formControlName="ddlrooms" [data]="rooms" [settings]="dropdownSettings_Rooms"
                      [placeholder]="'Rooms'" (onSelect)="onRoomSelect($event)" (onSelectAll)="onRoomSelectAll($event)"
                      (onDeSelect)="onRoomDeSelect($event)" (onDeSelectAll)="onRoomDeSelectAll($event)">
                    </ng-multiselect-dropdown>
                  </div> -->
                            <!-- <div class="col-sm-6 col-lg-2" *ngIf="companyToBed===1">
                    <label>Bed</label>
                    <ng-multiselect-dropdown class="form-control" formControlName="ddlbeds" [data]="beds" [settings]="dropdownSettings_Beds"
                      [placeholder]="'Beds'" (onSelect)="onBedSelect($event)" (onSelectAll)="onBedSelectAll($event)"
                      (onDeSelect)="onBedDeSelect($event)" (onDeSelectAll)="onBedDeSelectAll($event)">
                    </ng-multiselect-dropdown>
                  </div> -->
                        </div>
                        <div class="row form-group">
                            <div class="table-responsive">
                                <table id="tbltable" class="table table-bordered table-hover">
                                    <thead>
                                        <tr>
                                            <th>Resident</th>
                                            <th>Date/Time</th>
                                            <th>Drug Name</th>
                                            <th>Medication reason</th>
                                            <th>Dispensed By</th>
                                            <th>Nurse Notes</th>
                                            <th>Result</th>

                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let item of PRNData|gridFilter:searchText:'PRNdocument'|paginate: { itemsPerPage: gridPagination, currentPage: p };">
                                            <td>{{item.PatientName}}</td>
                                            <td>{{item.AdminsterOn|date :'MM/dd/yyyy hh:mm:ss a'}}</td>
                                            <td>{{item.GiveCodeText}}</td>
                                            <td>{{item.MedicationReason_Desc}}</td>
                                            <td>{{item.AdminsterBy}}</td>
                                            <td>{{item.AdministerComment}}</td>

                                            <td>
                                                <form [formGroup]="textform">
                                                    <input type="text" formControlName="text" (change)="UpdateArray(item.DrugAdminister_Id,$event.target.value)" />
                                                </form>
                                            </td>


                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <pagination-controls (pageChange)="p = $event" *ngIf="PRNData.length > 0"></pagination-controls>
                        </div>

                        <div style="text-align: right">
                            <input type="button" id="btnsave" [disabled]="textform.invalid" *ngIf="pageConfig['AccessWrite'] && PRNData.length > 0" value="Update" (click)="SavePRNData()" class="btn btn-success" />
                            <!-- <input type="button" id="btnreset" value="Do them Later" class="btn btn-danger" /> -->
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <ng4-loading-spinner [template]="template" [loadingText]="'Please wait...'" [timeout]="99000"></ng4-loading-spinner>
    </section>
</div>
