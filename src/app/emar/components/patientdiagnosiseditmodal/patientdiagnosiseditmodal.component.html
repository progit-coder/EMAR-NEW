<app-commonmodal title="Diagnosis Details">
  <div class="modal-body bodystyle">
    <form [formGroup]="icdform" name="diagnosis" autocomplete="off">
      <div class="row form-group">
        <div class="col-sm-4 col-md-6 col-lg-4">
          <div class="right">
            <label>Diagnosis
              <span class="c1">*</span></label>
          </div>
          <div class="left">
            <input formControlName="ddldiagnosis" class="form-control" type="text" [(ngModel)]="DiagnosisName"
              (keyup)="searchDiagnosis(DiagnosisName)" [ngClass]="{
                  'is-valid':icdform.controls.ddldiagnosis.valid,
                  'is-invalid':icdform.controls.ddldiagnosis.invalid && icdform.controls.ddldiagnosis.touched
                }" />
            <div *ngIf="errormessage1 != ''" style="color:red">
              <div class="right">
                <label>{{errormessage1}}</label>
              </div>
            </div>

            <div *ngIf="icdform.controls.ddldiagnosis.errors && (icdform.controls.ddldiagnosis.touched)"
              class="errorMessage">
              <div *ngIf="icdform.controls.ddldiagnosis.errors.required">
                Diagnosis is required.
              </div>
              <div *ngIf="icdform.controls.ddldiagnosis.errors.maxlength">
                Diagnosis cannot be more than 50 characters long.
              </div>
              <div *ngIf="icdform.controls.ddldiagnosis.errors.pattern">
                {{config.alphaNumericFewSpecialCharactersMessage6}}
              </div>
            </div>

            <div class="search-result" *ngIf="flag">
              <ul>
                <li (click)="onselectDiagnosis(item)" *ngFor="let item of diagnosisList | async">
                  {{item.ICD10_Description}}
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="col-sm-4 col-md-6 col-lg-4">
          <div class="right">
            <label>Diagnosis Date</label>
          </div>
          <div class="left">
            <input formControlName="diagnosisdate" type="date" [max]="maxDate" class="form-control" id="txtdiagnosisdate" [ngClass]="{
              'is-valid':icdform.controls.diagnosisdate.valid && icdform.controls.diagnosisdate.dirty,
              'is-invalid':icdform.controls.diagnosisdate.invalid && icdform.controls.diagnosisdate.touched
            }">
            <div *ngIf="errormessage3 != ''" style="color:red">
              <div class="right">
                <label>{{errormessage3}}</label>
              </div>
            </div>
            <div *ngIf="icdform.controls.diagnosisdate.errors && (icdform.controls.diagnosisdate.touched)"
              class="errorMessage">
              <div *ngIf="icdform.controls.diagnosisdate.errors.required">
                Diagnosis Date is required.
              </div>
            </div>
          </div>
        </div>
        <div class="col-sm-4 col-md-6 col-lg-4">
          <div class="right">
            <label>Prescriber Name<span class="c1">*</span></label>
          </div>
          <div class="left">
              <ng-multiselect-dropdown class="form-control" formControlName="physicianname"
              [data]="physiciansdrop"[(ngModel)]="selectedphyItems" [settings]="dropdownSettings_Physician">
            </ng-multiselect-dropdown>
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <div class="col-sm-10 col-md-10 col-lg-10" *ngIf="Approval==0 && pDiagnosisId !=0 " style="color:red">
      <div style="text-align:center">
        <label>{{errormessage2}}</label>
      </div>
    </div>
    <div class="col-sm-10 col-md-10 col-lg-10" style="color:red">
      <div style="text-align:center">
        <label>{{requiredErrorMessage}}</label>
      </div>
    </div>
    <button type="button" id="btnsave" (click)="saveDiagnosisForResident()" [disabled]="icdform.invalid"
      *ngIf=" (pageConfig['AccessWrite'] && Approval!=0 ) || (pDiagnosisId ==0 && pageConfig['AccessWrite'])"
      class="btn btn-success">Save</button>
    <button type="button" class="btn btn-danger" (click)="activeDefaultModal.close('Close click')">Close</button>
  </div>
</app-commonmodal>
